touch_scroll_multiplier 5.0
font_size 12.0
copy_on_select yes
map right_mouse_button paste_from_clipboard
mouse_map right press ungrabbed paste_from_selection

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
