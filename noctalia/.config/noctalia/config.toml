# Noctalia configuration (based on the shipped defaults, with personal edits).
# Changes made in the Settings window land in ~/.local/state/noctalia/settings.toml,
# which overrides this file. Move shared settings here; keep only machine-local ones
# (e.g. wallpaper) in settings.toml.
# Most changes are hot-reloaded via inotify; startup-only settings are noted inline.

[accessibility]
ui_scale = 1.1

[shell]
screen_time_enabled = true
polkit_agent = true

[shell.panel]
transparency_mode = "soft"

[shell.launcher]
categories = false
layout = "simple"

[shell.launcher.providers.calculator]
prefix = "calc"
global = true

[shell.launcher.providers.emoji]
prefix = "emo"

[shell.launcher.providers.session]
prefix = "session"
global = false

[shell.launcher.providers.wallpaper]
prefix = "wall"

[shell.launcher.providers.windows]
prefix = "win"

[shell.screen_corners]
size = 8

[wallpaper]
directory = "~/.config/assets/wallpapers"

# Wallpaper choice is machine-local: it lives in ~/.local/state/noctalia/settings.toml
# ([wallpaper.default] / per-monitor). Set it via the wallpaper panel or:
#   noctalia msg wallpaper-set <path>

[wallpaper.automation]
recursive = true

[theme]
builtin = "Rosé Pine"

[theme.templates]
builtin_ids = ["gtk3", "gtk4", "hyprland"]

[osd]
position = "top_right"

[osd.kinds]
power_profile = false

[audio]
enable_sounds = false

[location]
auto_locate = true

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"
enabled = true

[idle.behavior.suspend]
timeout = 1800
action = "lock_and_suspend"
enabled = true

[hooks]
session_locked = "pactl set-sink-mute @DEFAULT_SINK@ 1"

[bar.main]
background_opacity = 0.6
margin_ends = 180
margin_edge = 10
start = ["workspaces", "gap", "audio_visualizer"]
center = ["active_window"]
end = ["tray", "gap", "network", "bluetooth", "gap", "cpu", "separator", "volume", "separator", "brightness", "separator", "battery", "gap", "notifications", "clock"]

[desktop_widgets]
enabled = false

[widget.active_window]
max_length = 320
title_scroll = "on_hover"
display = "icon_and_text"
show_empty_label = true

[widget.cpu]
visualization = "none"

[widget.audio_visualizer]
width = 160
mirrored = true
show_wave = true
show_when_idle = false

[widget.network]
show_label = false
show_vpn_label = true

[widget.separator]
type = "text"
text = "│"

[widget.gap]
type = "spacer"
length = 32

[widget.workspaces]
style = "regular"
font_scale = 1.1
scale = 1.1

